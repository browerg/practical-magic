backend:
  name: github
  repo: browerg/practical-magic
  branch: main
  base_url: https://api.netlify.com

# Photos uploaded through the CMS land next to the site's other images
media_folder: "intro-images"
public_folder: "intro-images"

site_url: /
display_url: /

collections:
  - name: "site"
    label: "Site Content"
    files:
      - name: "content"
        label: "Rates, Notice & Testimonials"
        file: "content/site.json"
        fields:
          - label: "Hero Notice Banner"
            name: "notice"
            widget: "object"
            hint: "The 'Please note' banner on the front page — for away dates or announcements."
            fields:
              - { label: "Show the banner", name: "show", widget: "boolean", default: false }
              - { label: "Banner text", name: "text", widget: "string", hint: "e.g. Services unavailable June 15–28. Reach out for alternative resources." }

          - label: "Rate Cards"
            name: "rates"
            widget: "object"
            fields:
              - label: "Pet Care"
                name: "pet"
                widget: "object"
                fields:
                  - label: "Line items"
                    name: "items"
                    widget: "list"
                    label_singular: "Service"
                    summary: "{{fields.item}} — {{fields.price}}"
                    fields:
                      - { label: "Service", name: "item", widget: "string" }
                      - { label: "Price", name: "price", widget: "string", hint: "e.g. $20 or $60/night or $150–$320" }
                  - { label: "Fine print", name: "fineprint", widget: "text" }
              - label: "Home Cleaning"
                name: "cleaning"
                widget: "object"
                fields:
                  - label: "Line items"
                    name: "items"
                    widget: "list"
                    label_singular: "Service"
                    summary: "{{fields.item}} — {{fields.price}}"
                    fields:
                      - { label: "Service", name: "item", widget: "string" }
                      - { label: "Price", name: "price", widget: "string" }
                  - { label: "Fine print", name: "fineprint", widget: "text" }
              - label: "Yard Maintenance"
                name: "yard"
                widget: "object"
                fields:
                  - label: "Line items"
                    name: "items"
                    widget: "list"
                    label_singular: "Service"
                    summary: "{{fields.item}} — {{fields.price}}"
                    fields:
                      - { label: "Service", name: "item", widget: "string" }
                      - { label: "Price", name: "price", widget: "string" }
                  - { label: "Fine print", name: "fineprint", widget: "text" }

          - label: "Testimonials"
            name: "testimonials"
            widget: "list"
            required: false
            label_singular: "Testimonial"
            summary: "★  {{fields.name}} — “{{fields.quote}}”"
            hint: "Kind words from clients. The section only appears on the site once at least one is added."
            fields:
              - { label: "Who said it", name: "name", widget: "string", hint: "The client (and pet) being quoted — e.g. Sarah & Biscuit. This appears under the quote on the site." }
              - { label: "What they said", name: "quote", widget: "text", hint: "Their words only — quotation marks are added automatically." }

          - label: "Service Area Tags"
            name: "areas"
            widget: "list"
            required: false
            label_singular: "Neighbourhood"
            hint: "The little pills in the Service Area section."

          - label: "Terms of Service"
            name: "terms"
            widget: "object"
            collapsed: true
            hint: "The Terms of Service page (yoursite.com/terms.html). Editing here does not affect the rate cards on the home page."
            fields:
              - { label: "Subtitle", name: "subtitle", widget: "string", hint: "The small line under the page title." }
              - { label: "Last revised", name: "revised", widget: "string", hint: "e.g. August 13, 2025 — worth updating whenever you change anything below." }
              - label: "Sections"
                name: "sections"
                widget: "list"
                label_singular: "Section"
                summary: "{{fields.title}}"
                hint: "Each one is a card on the Terms page. Drag to reorder."
                fields:
                  - { label: "Section title", name: "title", widget: "string", hint: "e.g. Pet Care" }
                  - label: "Section content"
                    name: "body"
                    widget: "markdown"
                    buttons: ["bold", "italic", "bulleted-list", "numbered-list"]
                    editor_components: []
                    hint: "Use the bullet-list button for the point-by-point terms. A line starting with ### becomes a bold sub-heading."
